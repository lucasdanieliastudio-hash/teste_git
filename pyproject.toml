[project]
name = "f1"
version = "0.1.0"
description = "Dashboard de Formula 1 com as voltas mais rapidas por circuito usando a API OpenF1"
authors = [{ name = "Kemuel" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "streamlit (>=1.50.0,<2.0.0)",
    "httpx (>=0.27.0,<1.0.0)",
    "pydantic (>=2.7.0,<3.0.0)",
    "plotly (>=5.20.0,<7.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
]

[tool.poetry]
packages = [{ include = "f1", from = "src" }]

[dependency-groups]
dev = [
    "pytest (>=8.0.0,<10.0.0)",
    "pytest-cov (>=5.0.0,<8.0.0)",
    "pytest-mock (>=3.14.0,<4.0.0)",
    "ruff (>=0.6.0,<1.0.0)",
    "pre-commit (>=3.7.0,<5.0.0)",
    "taskipy (>=1.13.0,<2.0.0)",
]
docs = [
    "mkdocs-material (>=9.5.0,<10.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["f1"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------- Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src/f1 --cov-report=term-missing --cov-fail-under=50 -m 'not integration'"
markers = ["integration: testes que chamam a API real do OpenF1 (precisam de internet)"]

# ---------------------------------------------------------------- Atalhos (poetry run task <nome>)
[tool.taskipy.tasks]
app = { cmd = "streamlit run src/f1/dashboard.py", help = "Abre o dashboard em http://localhost:8501" }
test = { cmd = "pytest tests/unit/", help = "Roda os testes unitarios com cobertura" }
test-integration = { cmd = "pytest tests/integration/ -m integration --no-cov", help = "Testes contra a API real" }
lint = { cmd = "ruff check .", help = "Verifica erros de estilo e lint" }
format = { cmd = "ruff format .", help = "Formata o codigo" }
docs = { cmd = "mkdocs serve", help = "Documentacao em http://127.0.0.1:8000" }
docs-build = { cmd = "mkdocs build --strict", help = "Gera o site estatico da documentacao" }
